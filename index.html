<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#15161a">
  <title>Clicker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #15161a;
      --fg:     #c8c4b8;
      --muted:  #6e6c64;
      --accent: #a89868;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    body {
      font-family: 'Geist Mono', ui-monospace, 'SF Mono', Consolas, Menlo, monospace;
      font-weight: 400;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
      overflow: hidden;
    }

    .score-block {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    #count {
      font-family: inherit;
      font-weight: 400;
      font-size: clamp(56px, 14vw, 104px);
      line-height: 1;
      display: block;
      text-align: center;
      color: var(--fg);
    }

    .float {
      position: fixed;
      transform: translate(-50%, -50%);
      font-family: inherit;
      font-weight: 400;
      font-size: 20px;
      color: var(--accent);
      pointer-events: none;
      white-space: nowrap;
      animation: floatUp 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0%   { transform: translate(-50%, -50%); opacity: 0; }
      15%  { transform: translate(-50%, -80%); opacity: 1; }
      100% { transform: translate(-50%, -200%); opacity: 0; }
    }

    .upgrades {
      display: flex;
      flex-direction: row;
      gap: 1.5rem;
      align-items: flex-start;
      margin-bottom: 1.25rem;
    }

    .upgrade-column {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: center;
    }

    .column-header {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      text-align: center;
    }

    .stats {
      margin-bottom: 1rem;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .upgrade-button {
      font-family: inherit;
      font-size: 13px;
      font-weight: 400;
      padding: 8px 14px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--muted);
      border-radius: 0;
      cursor: pointer;
      transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }

    .upgrade-column .upgrade-button + .upgrade-button {
      margin-top: 6px;
    }

    .upgrade-button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .upgrade-button:not(:disabled):hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .upgrade-button:not(:disabled):active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(21, 22, 26, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal[hidden] {
      display: none;
    }

    .modal-content {
      border: 1px solid var(--muted);
      background: var(--bg);
      padding: 24px 32px;
      text-align: center;
    }

    .modal-text {
      color: var(--fg);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-buttons .upgrade-button {
      width: 90px;
      text-align: center;
    }

    .offline-gain {
      font-size: 24px;
      color: var(--fg);
      margin-bottom: 4px;
    }

    .offline-time {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    #reset {
      margin-top: 1.5rem;
      font-family: inherit;
      font-size: 11px;
      font-weight: 400;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.12s ease;
    }

    #reset:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="score-block">
    <span id="count">0.00</span>
  </div>

  <div class="upgrades">
    <section class="upgrade-column">
      <div class="column-header">[tap]</div>
      <div class="stats">
        <div id="stat-per-tap">+1 per tap</div>
        <div id="stat-tb">+0.6 per T+</div>
        <div id="stat-tbm">*1 per T++</div>
      </div>
      <button id="upgrade-click" class="upgrade-button">T+ (10)</button>
      <button id="upgrade-click-power" class="upgrade-button">T++ (50)</button>
    </section>

    <section class="upgrade-column">
      <div class="column-header">[idle]</div>
      <div class="stats">
        <div id="stat-per-sec">+0 per sec</div>
        <div id="stat-ib">+0.05 per I+</div>
        <div id="stat-ibm">*1 per I++</div>
      </div>
      <button id="upgrade-idle" class="upgrade-button">I+ (10)</button>
      <button id="upgrade-idle-power" class="upgrade-button">I++ (100)</button>
    </section>
  </div>

  <button id="reset">reset</button>

  <div id="reset-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-text">reset progress?</div>
      <div class="modal-buttons">
        <button id="reset-yes" class="upgrade-button">yes</button>
        <button id="reset-no" class="upgrade-button">no</button>
      </div>
    </div>
  </div>

  <div id="offline-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="offline-gain" id="offline-gain">+0</div>
      <div class="offline-time" id="offline-time">offline 0s</div>
      <div class="modal-buttons">
        <button id="offline-ok" class="upgrade-button">ok</button>
      </div>
    </div>
  </div>

  <script src="./balance.js"></script>
  <script>
    const SAVE_KEY = 'clicker-save';
    const TICK_MS = 100;
    const SAVE_THROTTLE_MS = 1000;
    const SCIENTIFIC_THRESHOLD = 1e6;

    const state = {};

    const display          = document.getElementById('count');
    const statPerTap       = document.getElementById('stat-per-tap');
    const statTB           = document.getElementById('stat-tb');
    const statTBM          = document.getElementById('stat-tbm');
    const statPerSec       = document.getElementById('stat-per-sec');
    const statIB           = document.getElementById('stat-ib');
    const statIBM          = document.getElementById('stat-ibm');
    const upgradeBtn       = document.getElementById('upgrade-click');
    const upgradePowerBtn  = document.getElementById('upgrade-click-power');
    const upgradeIdleBtn   = document.getElementById('upgrade-idle');
    const upgradeIdlePowerBtn = document.getElementById('upgrade-idle-power');
    const resetBtn         = document.getElementById('reset');
    const resetModal       = document.getElementById('reset-modal');
    const resetYesBtn      = document.getElementById('reset-yes');
    const resetNoBtn       = document.getElementById('reset-no');
    const offlineModal     = document.getElementById('offline-modal');
    const offlineGainEl    = document.getElementById('offline-gain');
    const offlineTimeEl    = document.getElementById('offline-time');
    const offlineOkBtn     = document.getElementById('offline-ok');

    function fmt(n) {
      if (n === 0) return '0';
      if (Math.abs(n) < SCIENTIFIC_THRESHOLD) {
        return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
      }
      return n.toExponential(2)
        .replace('e+', 'e')
        .replace(/\.?0+e/, 'e');
    }

    function fmtCount(n) {
      if (Math.abs(n) < SCIENTIFIC_THRESHOLD) {
        return n.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }
      return n.toExponential(2).replace('e+', 'e');
    }

    function getClickPowerMult() {
      return Math.pow(BALANCE.clickPowerUpgrade.factor, state.upgrades.clickPower);
    }

    function getClickDelta() {
      return BALANCE.clickUpgrade.delta * getClickPowerMult();
    }

    function getPerClick() {
      return BALANCE.startingPerTap + getClickDelta() * state.upgrades.click;
    }

    function getClickUpgradeCost() {
      const { base, mult } = BALANCE.clickUpgrade;
      return Math.ceil(base * Math.pow(mult, state.upgrades.click));
    }

    function getClickPowerUpgradeCost() {
      const { base, mult } = BALANCE.clickPowerUpgrade;
      return Math.ceil(base * Math.pow(mult, state.upgrades.clickPower));
    }

    function getIdlePowerMult() {
      return Math.pow(BALANCE.idlePowerUpgrade.factor, state.upgrades.idlePower);
    }

    function getIdleDelta() {
      return BALANCE.idleUpgrade.delta * getIdlePowerMult();
    }

    function getPerSec() {
      return BALANCE.startingPerSec + getIdleDelta() * state.upgrades.idle;
    }

    function getIdleUpgradeCost() {
      const { base, mult } = BALANCE.idleUpgrade;
      return Math.ceil(base * Math.pow(mult, state.upgrades.idle));
    }

    function getIdlePowerUpgradeCost() {
      const { base, mult } = BALANCE.idlePowerUpgrade;
      return Math.ceil(base * Math.pow(mult, state.upgrades.idlePower));
    }

    function resetState() {
      state.count = 0;
      state.upgrades = { click: 0, clickPower: 0, idle: 0, idlePower: 0 };
      state.lastTick = Date.now();
    }

    function clampDt(seconds) {
      const cap = BALANCE.maxOfflineHours * 3600;
      return Math.max(0, Math.min(seconds, cap));
    }

    function render() {
      display.textContent = fmtCount(state.count);

      statPerTap.textContent = `+${fmt(getPerClick())} per tap`;
      statTB.textContent     = `+${fmt(getClickDelta())} per T+`;
      statTBM.textContent    = `*${fmt(getClickPowerMult())} per T++`;

      statPerSec.textContent = `+${fmt(getPerSec())} per sec`;
      statIB.textContent     = `+${fmt(getIdleDelta())} per I+`;
      statIBM.textContent    = `*${fmt(getIdlePowerMult())} per I++`;

      const tbCost = getClickUpgradeCost();
      upgradeBtn.textContent = `T+ (${fmt(tbCost)})`;
      upgradeBtn.disabled = state.count < tbCost;

      const tbmCost = getClickPowerUpgradeCost();
      upgradePowerBtn.textContent = `T++ (${fmt(tbmCost)})`;
      upgradePowerBtn.disabled = state.count < tbmCost;

      const ibCost = getIdleUpgradeCost();
      upgradeIdleBtn.textContent = `I+ (${fmt(ibCost)})`;
      upgradeIdleBtn.disabled = state.count < ibCost;

      const ibmCost = getIdlePowerUpgradeCost();
      upgradeIdlePowerBtn.textContent = `I++ (${fmt(ibmCost)})`;
      upgradeIdlePowerBtn.disabled = state.count < ibmCost;
    }

    let lastSaveTime = 0;

    function save() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      lastSaveTime = Date.now();
    }

    function saveThrottled() {
      if (Date.now() - lastSaveTime >= SAVE_THROTTLE_MS) save();
    }

    function load() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (typeof data.count === 'number') state.count = data.count;
        if (data.upgrades) Object.assign(state.upgrades, data.upgrades);

        if (typeof data.lastTick === 'number') {
          const dt = clampDt((Date.now() - data.lastTick) / 1000);
          const gain = getPerSec() * dt;
          if (gain > 0) {
            if (dt > 30) {
              showOfflineModal(gain, dt);
            } else {
              state.count += gain;
            }
          }
        }
      } catch (e) {
        console.warn('clicker: save is corrupted, starting fresh', e);
      }
    }

    function fmtDuration(seconds) {
      const s = Math.floor(seconds);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      if (m < 60) {
        const sec = s % 60;
        return sec === 0 ? `${m}m` : `${m}m ${sec}s`;
      }
      const h = Math.floor(m / 60);
      const min = m % 60;
      return min === 0 ? `${h}h` : `${h}h ${min}m`;
    }

    let pendingOfflineGain = 0;

    function showOfflineModal(gain, seconds) {
      pendingOfflineGain = gain;
      offlineGainEl.textContent = `+${fmt(gain)}`;
      offlineTimeEl.textContent = `offline ${fmtDuration(seconds)}`;
      offlineModal.hidden = false;
    }

    function closeOfflineModal() {
      if (pendingOfflineGain > 0) {
        const gain = pendingOfflineGain;
        pendingOfflineGain = 0;
        state.count += gain;
        const rect = display.getBoundingClientRect();
        spawnFloat(`+${fmt(gain)}`, rect.left + rect.width / 2, rect.top + rect.height / 2);
        render();
        save();
      }
      offlineModal.hidden = true;
    }

    function spawnFloat(text, x, y) {
      const float = document.createElement('span');
      float.className = 'float';
      float.textContent = text;
      float.style.left = `${x}px`;
      float.style.top = `${y}px`;
      document.body.appendChild(float);
      setTimeout(() => float.remove(), 900);
    }

    function doTap(x, y) {
      const gain = getPerClick();
      state.count += gain;
      render();
      save();
      spawnFloat(`+${fmt(gain)}`, x, y);
    }

    const holds = new Map(); // pointerId -> { x, y, timer }

    function stopHold(pointerId) {
      const h = holds.get(pointerId);
      if (!h) return;
      clearInterval(h.timer);
      holds.delete(pointerId);
    }

    document.body.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      const h = { x: e.clientX, y: e.clientY, timer: null };
      doTap(h.x, h.y);
      h.timer = setInterval(() => doTap(h.x, h.y), BALANCE.holdTickMs);
      holds.set(e.pointerId, h);
    });

    document.body.addEventListener('pointermove', (e) => {
      const h = holds.get(e.pointerId);
      if (!h) return;
      h.x = e.clientX;
      h.y = e.clientY;
    });

    document.body.addEventListener('pointerup',     (e) => stopHold(e.pointerId));
    document.body.addEventListener('pointercancel', (e) => stopHold(e.pointerId));
    document.body.addEventListener('pointerleave',  (e) => stopHold(e.pointerId));

    upgradeBtn.addEventListener('click', () => {
      const cost = getClickUpgradeCost();
      if (state.count < cost) return;
      state.count -= cost;
      state.upgrades.click += 1;
      render();
      save();
    });

    upgradePowerBtn.addEventListener('click', () => {
      const cost = getClickPowerUpgradeCost();
      if (state.count < cost) return;
      state.count -= cost;
      state.upgrades.clickPower += 1;
      render();
      save();
    });

    upgradeIdleBtn.addEventListener('click', () => {
      const cost = getIdleUpgradeCost();
      if (state.count < cost) return;
      state.count -= cost;
      state.upgrades.idle += 1;
      render();
      save();
    });

    upgradeIdlePowerBtn.addEventListener('click', () => {
      const cost = getIdlePowerUpgradeCost();
      if (state.count < cost) return;
      state.count -= cost;
      state.upgrades.idlePower += 1;
      render();
      save();
    });

    resetBtn.addEventListener('click', () => {
      resetModal.hidden = false;
    });

    resetYesBtn.addEventListener('click', () => {
      resetState();
      render();
      save();
      resetModal.hidden = true;
    });

    resetNoBtn.addEventListener('click', () => {
      resetModal.hidden = true;
    });

    resetModal.addEventListener('pointerdown', (e) => e.stopPropagation());
    resetModal.addEventListener('click', (e) => {
      if (e.target === resetModal) resetModal.hidden = true;
    });

    offlineOkBtn.addEventListener('click', closeOfflineModal);

    offlineModal.addEventListener('pointerdown', (e) => e.stopPropagation());
    offlineModal.addEventListener('click', (e) => {
      if (e.target === offlineModal) closeOfflineModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!resetModal.hidden) resetModal.hidden = true;
      if (!offlineModal.hidden) closeOfflineModal();
    });

    resetState();
    load();
    render();

    function tick() {
      const now = Date.now();
      const dt = clampDt((now - state.lastTick) / 1000);
      state.lastTick = now;

      const perSec = getPerSec();
      if (perSec > 0) {
        state.count += perSec * dt;
        render();
        saveThrottled();
      }
    }

    setInterval(tick, TICK_MS);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((e) => {
          console.warn('clicker: SW registration failed', e);
        });
      });
    }
  </script>
</body>
</html>
